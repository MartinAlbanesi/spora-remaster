[versions]
agp = "8.6.1"
kotlin = "2.0.20"
coreKtx = "1.13.1"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
lifecycleRuntimeKtx = "2.8.6"
activityCompose = "1.9.2"
composeBom = "2024.09.03"

#hilt
ksp = "2.0.20-1.0.25"
hilt = "2.49"
hiltNavigationCompose = "1.2.0"

# Kotlin Serialization
kotlinx-serialization = "1.6.3"

# Navigation Compose
navigationCompose = "2.8.2"

# Detekt
detekt = "1.23.6"

# Firebase
firebaseBom = "33.4.0"

# Google Services
googleService = "4.4.2"
uiTextGoogleFonts = "1.7.3"

# Camera X
camerax = "1.3.4"

# Tensor Flow Lite
tensorflowgpu = "2.14.0"
tensorflowmetadata = "0.1.0"
tensorflow = "+"

# Coil
coil = "2.7.0"

# Room
room = "2.6.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }

#hilt
hilt-android-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# Navigation Compose
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

# Kotlin Serialization
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# Firebase
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics-ktx" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics-ktx" }
firebase-auth = { group = "com.google.firebase", name = "firebase-auth-ktx" }
androidx-ui-text-google-fonts = { group = "androidx.compose.ui", name = "ui-text-google-fonts", version.ref = "uiTextGoogleFonts" }


# Camera X
camerax-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax"}
camerax-camera2 = { group = "androidx.camera", name = "camera-camera2",  version.ref = "camerax"}
camerax-lifecycle = { group = "androidx.camera", name = "camera-lifecycle",  version.ref = "camerax"}
camerax-video = { group = "androidx.camera", name = "camera-video",  version.ref = "camerax"}
camera-view = { group = "androidx.camera", name = "camera-view",  version.ref = "camerax"}
camerax-extensions = { group = "androidx.camera", name = "camera-extensions",  version.ref = "camerax"}

# Tensor Flow Lite
tensorflow-gpu = { group = "org.tensorflow", name = "tensorflow-lite-gpu",  version.ref = "tensorflowgpu"}
tensorflow-select = { group = "org.tensorflow", name = "tensorflow-lite-select-tf-ops",  version.ref = "tensorflowgpu"}
tensorflow-android = { group = "org.tensorflow", name = "tensorflow-lite",  version.ref = "tensorflow"}
tensorflow-support = { group = "org.tensorflow", name = "tensorflow-lite-support",  version.ref = "tensorflow"}
tensorflow-metadata = { group = "org.tensorflow", name = "tensorflow-lite-metadata",  version.ref = "tensorflowmetadata"}

# Coil
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

# Room
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

#ksp-hilt
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }

# Kotlin Serialization
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

# Detekt
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }

# Google Services
googleServices = { id = "com.google.gms.google-services", version.ref = "googleService" }
